</style></head><body><header><h1>Card Echoes + Constellation / three SVG layers</h1><div class="controls"><label class="layer"><span><input type="checkbox" id="on0" checked>Card echoes <small>Warm slate</small></span><input type="range" id="level0" aria-label="Card echoes intensity" min="0" max="150" value="100"><output id="value0">100%</output></label><label class="layer"><span><input type="checkbox" id="on1" checked>Connections <small>Blue gray</small></span><input type="range" id="level1" aria-label="Connections intensity" min="0" max="150" value="100"><output id="value1">100%</output></label><label class="layer"><span><input type="checkbox" id="on2" checked>Stars <small>Pale silver</small></span><input type="range" id="level2" aria-label="Stars intensity" min="0" max="150" value="100"><output id="value2">100%</output></label></div><label class="layout"><input type="checkbox" id="showLayout" checked> Show sample app layout</label></header><main id="sample"><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="920" viewBox="260 15 1080 920"><title>Sample layout</title><g font-family="Arial, sans-serif">

<rect x="385" y="302" width="405" height="183" rx="16" fill="#23262d" stroke="#343844"/><rect x="405" y="322" width="32" height="32" rx="9" fill="#303b52"/><text x="405" y="394" fill="#f2f4f8" font-size="21" font-weight="700">Chaos Draft</text><text x="405" y="424" fill="#a9b0be" font-size="15">Build your next draft experience.</text><rect x="810" y="302" width="405" height="183" rx="16" fill="#23262d" stroke="#343844"/><rect x="830" y="322" width="32" height="32" rx="9" fill="#303b52"/><text x="830" y="394" fill="#f2f4f8" font-size="21" font-weight="700">Play Momir</text><text x="830" y="424" fill="#a9b0be" font-size="15">Let the next card surprise you.</text><rect x="385" y="507" width="405" height="183" rx="16" fill="#23262d" stroke="#343844"/><rect x="405" y="527" width="32" height="32" rx="9" fill="#303b52"/><text x="405" y="599" fill="#f2f4f8" font-size="21" font-weight="700">Custom Sets</text><text x="405" y="629" fill="#a9b0be" font-size="15">Create a world of your own.</text><rect x="810" y="507" width="405" height="183" rx="16" fill="#23262d" stroke="#343844"/><rect x="830" y="527" width="32" height="32" rx="9" fill="#303b52"/><text x="830" y="599" fill="#f2f4f8" font-size="21" font-weight="700">Deck Roulette</text><text x="830" y="629" fill="#a9b0be" font-size="15">Find a new deck to play.</text><path d="M385 735H1215" stroke="#343844"/><text x="385" y="776" fill="#a9b0be" font-size="12" letter-spacing="2">HELP &amp; GUIDED LEARNING</text><text x="385" y="815" fill="#f2f4f8" font-size="24" font-weight="700">Enlightened Tutor</text></g></svg></main><footer>Outer background only. Separate assets: <a href="cards.svg">Cards</a> · <a href="connections.svg">Connections</a> · <a href="stars.svg">Stars</a>. Concept preview; the live app is unchanged.</footer><script>
const sources=["<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"760\" height=\"680\" viewBox=\"0 0 760 680\"><title>Card echoes \u2014 warm slate</title><g transform=\"translate(50 70) rotate(-12 62 86)\" fill=\"none\" stroke=\"#b3a99b\" stroke-width=\"1\" opacity=\"0.115\"><rect x=\"0\" y=\"0\" width=\"124\" height=\"172\" rx=\"10\" /><rect x=\"10\" y=\"10\" width=\"124\" height=\"172\" rx=\"10\" /><path d=\"M24 43H108M24 143H108\" /></g><g transform=\"translate(425 350) rotate(13 62 86)\" fill=\"none\" stroke=\"#b3a99b\" stroke-width=\"1\" opacity=\"0.115\"><rect x=\"0\" y=\"0\" width=\"124\" height=\"172\" rx=\"10\" /><rect x=\"10\" y=\"10\" width=\"124\" height=\"172\" rx=\"10\" /><path d=\"M24 43H108M24 143H108\" /></g></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"900\" height=\"620\" viewBox=\"0 0 900 620\"><title>Constellation paths \u2014 blue gray</title><g fill=\"none\" stroke=\"#7897b4\" stroke-width=\"1\" opacity=\"0.12\"><path d=\"M60 75L185 130L282 55M185 130L225 255M555 345L685 275L794 370L710 501M555 345L525 477\" /></g></svg>", "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"900\" height=\"620\" viewBox=\"0 0 900 620\"><title>Constellation stars \u2014 pale silver</title><circle cx=\"60\" cy=\"75\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"185\" cy=\"130\" r=\"3\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"282\" cy=\"55\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"225\" cy=\"255\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"555\" cy=\"345\" r=\"3\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"685\" cy=\"275\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"794\" cy=\"370\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"710\" cy=\"501\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"525\" cy=\"477\" r=\"2\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"425\" cy=\"110\" r=\"1\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"99\" cy=\"449\" r=\"1\" fill=\"#b9c8d6\" opacity=\"0.23\" /><circle cx=\"347\" cy=\"528\" r=\"1\" fill=\"#b9c8d6\" opacity=\"0.23\" /></svg>"];
function update(){document.body.style.backgroundImage=sources.map((source,i)=>{const level=Number(document.getElementById('level'+i).value)/100;document.getElementById('value'+i).value=Math.round(level*100)+'%';if(!document.getElementById('on'+i).checked)return 'none';const scaled=source.replace(/opacity="([0-9.]+)"/g,(_,v)=>'opacity="'+Math.min(1,Number(v)*level)+'"');return 'url("data:image/svg+xml,'+encodeURIComponent(scaled)+'")'}).join(',')}
document.querySelectorAll('.controls input').forEach(e=>e.addEventListener('input',update));document.getElementById('showLayout').addEventListener('change',e=>document.getElementById('sample').hidden=!e.target.checked);update();
</script></body></html>
