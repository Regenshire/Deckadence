<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Momir · Theme preview</title>
<script src="../../../../js/theme_catalog.js"></script><script src="../../../../js/deckadence_message_cards.js?v=inserts-3"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px Arial,sans-serif;background-size:2240px 1540px}button,input,select{font:inherit;color:var(--text);background:var(--panel-2);border:1px solid var(--edge);border-radius:10px;min-height:44px;padding:10px 14px}button{cursor:pointer;font-weight:700}button:hover{background:var(--button-hover)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.primary,button.active{color:#fff;background:var(--accent);border-color:var(--accent)}main{max-width:1400px;margin:auto;padding:18px 24px}nav{display:flex;align-items:center;gap:28px;padding:16px 24px;background:var(--panel);border:1px solid var(--edge);border-radius:22px}nav img{width:280px;max-width:42%}.navlinks{display:flex;gap:24px;font-weight:700}.preview{margin-left:auto;display:flex;align-items:center;gap:10px}.preview span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}header{max-width:820px;margin:28px auto 18px;display:flex;align-items:center;justify-content:space-between;gap:16px}.eyebrow{color:var(--accent);text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:2px}h1{font-size:28px;margin:8px 0 0}h2{font-size:21px;margin:6px 0}.view-switch{display:flex;gap:6px}.view-switch button{font-size:13px;padding:8px 12px}.frame{max-width:820px;margin:auto;border:4px solid var(--edge);border-radius:26px;background:var(--panel);overflow:hidden}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 24px;border-bottom:1px solid var(--edge)}.topbar p{margin:5px 0 0;font-size:13px;color:var(--muted)}.topbar select{max-width:150px;font-size:14px}.board{padding:22px;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;gap:18px;max-width:550px;margin:auto}.rail{display:grid;grid-template-rows:repeat(9,1fr);gap:6px}.rail button{padding:0;font-size:17px;min-height:44px}.center{display:flex;flex-direction:column;gap:18px;min-width:0}.card{aspect-ratio:63/88;width:100%;border-radius:18px;overflow:hidden;box-shadow:0 6px 16px #0003;background:var(--panel-2);position:relative}.card img{display:block;width:100%;height:100%;object-fit:contain}.message{height:100%;padding:9%;display:flex;flex-direction:column;justify-content:center;background:linear-gradient(130deg,transparent,color-mix(in srgb,var(--accent) 7%,transparent),transparent),var(--panel-2);border:1px solid var(--edge);border-radius:18px}.message-inner{border:4px solid var(--edge);border-radius:26px;overflow:hidden}.message-title{font-size:clamp(48px,6vw,88px);line-height:1.02;font-weight:900;letter-spacing:-3px;text-align:center;padding:34px 12px;color:var(--text);background:var(--panel)}.message-note{display:flex;gap:12px;align-items:center;border-top:1px solid var(--edge);padding:20px 14px;font-size:15px;line-height:1.4;font-weight:700}.message-note img{width:28px;height:32px}.message-footer{margin-top:22px;font-size:9px;letter-spacing:1px;color:var(--muted);display:flex;justify-content:space-between}.actions{display:grid;grid-template-columns:1fr 1fr 44px;gap:8px}.actions button{padding:10px 5px}.foot{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--edge);background:var(--panel-2);font-size:13px;color:var(--muted)}.foot img{width:23px;height:23px}.foot strong{color:var(--text)}.foot span:last-child{margin-left:auto}.entry{max-width:410px;margin:24px auto;padding:0 22px}.entry label{display:grid;gap:8px;color:var(--muted);font-size:13px}.entry input{text-align:center;font-size:32px;width:100%;height:64px}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.keypad button{min-height:56px;font-size:19px}.entry>.primary{width:100%;margin-bottom:4px}.review-note{max-width:820px;margin:18px auto;color:var(--muted);font-size:12px;line-height:1.6}.review-note select{min-height:34px;font-size:12px;padding:4px 8px;margin-right:8px}dialog{color:var(--text);background:var(--panel);border:2px solid var(--edge);border-radius:18px;max-width:90%;padding:24px}dialog::backdrop{background:#0008}dialog input{width:100%;margin:12px 0}dialog .actions{grid-template-columns:1fr 1fr}[hidden]{display:none!important}.reveal{animation:reveal .3s ease-out}@keyframes reveal{from{opacity:.3;transform:scale(.96)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){.reveal{animation:none}}
@media(max-width:700px){main{padding:12px}nav{padding:12px;gap:12px}.navlinks{display:none}nav img{width:170px}.preview span{display:none}.preview select{max-width:132px;font-size:13px}header{margin:18px 0 14px}h1{font-size:22px}.view-switch button{font-size:12px;padding:8px}.frame{border-width:3px}.topbar{padding:16px}.board{padding:16px 12px;grid-template-columns:44px minmax(0,1fr) 44px;gap:12px}.center{gap:14px}.card{margin:auto 0}.message{padding:6%}.message-title{font-size:52px;padding:28px 6px}.message-note{font-size:12px;padding:12px 8px;gap:7px}.message-note img{width:20px}.message-footer{font-size:7px;margin-top:16px}.message-inner{border-width:3px;border-radius:17px}.actions{grid-template-columns:1fr 1fr;gap:6px}.actions button{font-size:13px}.actions button:last-child{grid-column:1 / -1}.foot{padding:12px;font-size:11px}.foot img{display:none}.topbar h2{font-size:18px}}
</style></head><body><main>
<nav><img src="../../../Logos/deckadence.svg" alt="Deckadence"><div class="navlinks"><span>Home</span><span>Play</span><span>Cards</span></div><label class="preview"><span>Theme preview</span><select id="theme" aria-label="Preview theme"></select></label></nav>
<header><div><div class="eyebrow">Play / Momir</div><h1>A little mana. A little mayhem.</h1></div><div class="view-switch"><button id="entryTab">Mana entry</button><button id="resultTab" class="active">Card view</button></div></header>
<section class="frame"><div class="topbar"><div><div class="eyebrow">Momir Basic</div><h2 id="title">Discard a Card. See what happens.</h2><p id="hint">Choose a mana value to draw again.</p></div><label id="typeWrap" hidden><select aria-label="Card type"><option>Creature</option><option>Artifact</option><option>Enchantment</option></select></label></div>
<div class="board" id="board"><div class="rail" id="left"></div><div class="center"><div class="card" id="card"></div><div class="actions"><button id="again" class="primary">Again</button><button id="print">Print</button><button id="custom" aria-label="Enter a custom mana value" title="Custom mana value">▦</button></div></div><div class="rail" id="right"></div></div>
<form class="entry" id="entry" hidden><label>Mana value<input id="mana" inputmode="numeric" type="number" min="0" max="99" value="6" required></label><div class="keypad" id="keypad"></div><button class="primary">Draw →</button></form>
<div class="foot"><img src="../../../Logos/deckadence_d.svg" alt=""><strong id="status">No matching card</strong><span id="value">Mana value · 14</span></div></section>
<div class="review-note"><select id="state" aria-label="Preview card state"><option value="empty">Oh No card</option><option value="sample">Sample card</option></select><select id="mode" aria-label="Preview game mode"><option>Momir Basic</option><option>Momir Select</option><option>Momir Planeswalker</option><option>Momir Legends</option><option>Momir Battleship</option><option>Momir Aggro</option><option>Momir Odds</option><option>Momir Evens</option><option>Momir Prime</option><option>Custom</option></select><span id="notice" aria-live="polite">Design preview · Try the mana controls and theme selector. Sample art only; no game data changes.</span></div>
</main><dialog id="dialog"><form id="customForm"><h2>Draw by mana value</h2><label>Mana value<input id="customValue" type="number" min="0" max="99" value="6" required></label><div class="actions"><button type="button" id="cancel">Cancel</button><button class="primary">Draw</button></div></form></dialog>
<script>
const $=id=>document.getElementById(id);let mana=14;const themes=window.DeckadenceThemeCatalog;themes.forEach(t=>$('theme').add(new Option(t.name,t.id)));$('theme').value='white-mana';function theme(){const t=themes.find(t=>t.id===$('theme').value);document.documentElement.dataset.theme=t.id;Object.entries(t.colors).forEach(([k,v])=>document.body.style.setProperty('--'+k,v));document.body.style.setProperty('--edge',t.id==='white-mana'?'#b5a17b':'color-mix(in srgb,var(--border) 75%,var(--accent))');document.querySelector('nav img').src='../../../Logos/'+(t.scheme==='light'?'deckadence-light.svg':'deckadence.svg');document.body.style.backgroundImage=`url('../../card-constellation-${t.scheme}.svg')`;}theme();$('theme').onchange=theme;
function showResult(yes){$('entry').hidden=yes;$('board').hidden=!yes;$('entryTab').classList.toggle('active',!yes);$('resultTab').classList.toggle('active',yes);$('hint').textContent=yes?'Choose a mana value to draw again.':'Enter your mana value, then draw.';}
function render(){document.querySelectorAll('[data-mana]').forEach(b=>{b.classList.toggle('active',Number(b.dataset.mana)===mana);b.setAttribute('aria-pressed',Number(b.dataset.mana)===mana)});$('value').textContent='Mana value · '+mana;const empty=$('state').value==='empty';$('status').textContent=empty?'No matching card':'Sample card · Momir Vig';$('print').disabled=empty;$('card').replaceChildren();if(empty){$('card').append(deckadenceMessageCards({themed:true,title:['Oh','No!'],subtitle:['No cards have that','mana cost, Sorry!'],number:'0404',category:'NO',edition:'SORRY * EN',footer:'Deckadence iMomir Mode',baseUrl:'../../../inserts/deckadence-gold-no-foil.svg',overlayUrl:'../../../inserts/deckadence-foil-overlay.svg'}))}else{$('card').innerHTML='<img src="../../../MomirVig_Token_1.jpg" alt="Momir Vig sample rules card">'};$('card').classList.remove('reveal');void $('card').offsetWidth;$('card').classList.add('reveal');}
for(let i=0;i<18;i++){let b=document.createElement('button');b.textContent=i;b.dataset.mana=i;b.setAttribute('aria-label','Draw at mana value '+i);b.onclick=()=>{mana=i;render()};$(i<9?'left':'right').append(b)}
for(const key of ['1','2','3','4','5','6','7','8','9','Clear','0','⌫']){let b=document.createElement('button');b.type='button';b.textContent=key;b.onclick=()=>{$('mana').value=key==='Clear'?'':key==='⌫'?$('mana').value.slice(0,-1):($('mana').value+key).slice(-2)};$('keypad').append(b)}
$('entryTab').onclick=()=>showResult(false);$('resultTab').onclick=()=>showResult(true);$('entry').onsubmit=e=>{e.preventDefault();mana=Number($('mana').value);showResult(true);render()};$('again').onclick=render;$('state').onchange=render;$('mode').onchange=()=>{$('typeWrap').hidden=$('mode').value!=='Momir Select';document.querySelector('.topbar .eyebrow').textContent=$('mode').value==='Custom'?'Momir Vig':$('mode').value};$('custom').onclick=()=>{$('customValue').value=mana;$('dialog').showModal()};$('cancel').onclick=()=>$('dialog').close();$('customForm').onsubmit=e=>{e.preventDefault();mana=Number($('customValue').value);$('dialog').close();render()};$('print').onclick=()=>$('notice').textContent='Preview only: Print will use your existing print settings in the live screen.';render();
</script></body></html>
