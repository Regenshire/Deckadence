<svg xmlns="http://www.w3.org/2000/svg" width="2.5in" height="3.48028in" viewBox="0 0 431 600">
<title>Deckadence — transparent foil overlay</title>
<desc>Align to the full card canvas above artwork and text. Transparent outside the inner panel. Color bands have partial transparency so underlying lettering remains visible. Adjust layer opacity to taste.</desc>
<defs>
<linearGradient id="foilOverlay" x1="0" y1="0" x2="1" y2="0">
<stop stop-color="#edb45c" stop-opacity=".24"/>
<stop offset=".09" stop-color="#ffe08b" stop-opacity=".28"/>
<stop offset=".16" stop-color="#dbe58a" stop-opacity=".18"/>
<stop offset=".24" stop-color="#7fdfd8" stop-opacity=".30"/>
<stop offset=".32" stop-color="#eff6af" stop-opacity=".20"/>
<stop offset=".4" stop-color="#a4d9cf" stop-opacity=".18"/>
<stop offset=".48" stop-color="#dfadbe" stop-opacity=".22"/>
<stop offset=".54" stop-color="#b0b3f2" stop-opacity=".30"/>
<stop offset=".6" stop-color="#93e4c7" stop-opacity=".24"/>
<stop offset=".65" stop-color="#f9ed9e" stop-opacity=".32"/>
<stop offset=".7" stop-color="#9cded7" stop-opacity=".24"/>
<stop offset=".77" stop-color="#d9aec2" stop-opacity=".21"/>
<stop offset=".86" stop-color="#edcc94" stop-opacity=".15"/>
<stop offset=".94" stop-color="#f2dfb5" stop-opacity=".18"/>
<stop offset="1" stop-color="#b5c3de" stop-opacity=".16"/>
</linearGradient>
</defs>
<rect x="58" y="94" width="317" height="411" rx="25" fill="url(#foilOverlay)"/>
</svg>