<section id="section_theme" class="page-panel collapsible-panel" data-section="theme">
  <button type="button" class="collapsible-header" aria-expanded="false" aria-controls="themeSettingsBody" id="themeSettingsHeading">
    <span>Theme</span><span class="collapsible-chevron" aria-hidden="true">▾</span>
  </button>
  <div class="collapsible-body" id="themeSettingsBody">
    <p class="theme-intro">Make Deckadence feel like yours. Changes apply immediately and are saved in this browser.</p>
    <fieldset class="theme-fieldset">
      <legend class="theme-legend">Choose a theme</legend>
      <div class="theme-grid" data-theme-grid></div>
    </fieldset>
    <label class="theme-background-control" for="themeBackgroundToggle">
      <span><strong>Background</strong><span class="theme-control-description">Show the selected pattern behind the app.</span></span>
      <span class="theme-switch"><input id="themeBackgroundToggle" type="checkbox" role="switch" data-theme-background><span class="theme-switch-track" aria-hidden="true"></span></span>
    </label>
    <div class="theme-background-options">
      <label for="themeBackgroundSelect">Select Background</label>
      <select id="themeBackgroundSelect" data-background-setting="backgroundType">
        <option value="logo">Deckadence Logo</option>
        <option value="constellation">Card Constellation</option>
      </select>
      <label for="themeBackgroundIntensity">Background Intensity <output for="themeBackgroundIntensity" data-background-output="backgroundIntensity">100%</output></label>
      <input id="themeBackgroundIntensity" type="range" min="0" max="150" step="5" value="100" data-background-setting="backgroundIntensity">
      <label for="themeBackgroundSize">Background Size <output for="themeBackgroundSize" data-background-output="backgroundSize">100%</output></label>
      <input id="themeBackgroundSize" type="range" min="50" max="200" step="5" value="100" data-background-setting="backgroundSize">
    </div>
    <label class="theme-background-control" for="themeBackgroundAnimations">
      <span><strong>Background Animations</strong><span class="theme-control-description">Animate the constellation ley lines. Pauses in hidden tabs and respects reduced-motion preferences.</span></span>
      <span class="theme-switch"><input id="themeBackgroundAnimations" type="checkbox" role="switch" data-background-setting="backgroundAnimations"><span class="theme-switch-track" aria-hidden="true"></span></span>
    </label>
    <p class="theme-note">Dark keeps the current look. Backup Theme preserves the original shared styles as a fallback.</p>
    <p class="theme-status" data-theme-status role="status" aria-live="polite"></p>
    <noscript>Enable JavaScript to change themes. The original Dark appearance is still available.</noscript>
  </div>
</section>
