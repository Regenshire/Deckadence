<div
  id="deckArtModal"
  class="campaign-add-pack-modal deck-art-modal hidden"
  aria-hidden="true"
>
  <div class="campaign-add-pack-backdrop" data-deck-art-close></div>

  <div
    class="campaign-add-pack-dialog deck-art-modal-dialog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="deckArtModalTitle"
  >
    <div class="campaign-add-pack-header deck-art-modal-header">
      <div>
        <h2 id="deckArtModalTitle" class="campaign-add-pack-title">
          Regenerate Deck Art
        </h2>

        <p class="campaign-add-pack-subtitle">
          Choose the artwork, frame, crop, and deck text.
        </p>
      </div>

      <button
        type="button"
        class="action-button secondary-button deck-art-modal-close"
        aria-label="Close"
        title="Close"
        data-deck-art-close
      >
        ×
      </button>
    </div>

    <div class="deck-art-modal-body">
      <aside class="deck-art-preview-panel">
        <div class="deck-art-section-label">Preview</div>

        <div
          class="deck-art-preview-stage"
          data-deck-art-preview-stage
          data-frame="silver"
        >
          <div class="deck-art-preview-art-box" data-deck-art-art-box>
            <img
              class="deck-art-preview-source hidden"
              alt=""
              data-deck-art-source-image
            />

            <div class="deck-art-preview-empty" data-deck-art-preview-empty>
              Loading artwork...
            </div>
          </div>

          <img
            class="deck-art-preview-frame hidden"
            alt=""
            data-deck-art-frame-image
          />

          <div class="deck-art-preview-title" data-deck-art-preview-title></div>

          <div
            class="deck-art-preview-subtitle"
            data-deck-art-preview-subtitle
          ></div>

          <div class="deck-art-preview-type" data-deck-art-preview-type></div>
        </div>

        <div class="deck-art-framing-controls">
          <label class="deck-art-range-control">
            <span>
              <strong>Zoom</strong>
              <output data-deck-art-zoom-output>100%</output>
            </span>

            <input
              type="range"
              min="1"
              max="3"
              step="0.01"
              value="1"
              data-deck-art-zoom
            />
          </label>

          <label class="deck-art-range-control">
            <span>
              <strong>Horizontal</strong>
              <output data-deck-art-x-output>Center</output>
            </span>

            <input
              type="range"
              min="-1"
              max="1"
              step="0.01"
              value="0"
              data-deck-art-x
            />
          </label>

          <label class="deck-art-range-control">
            <span>
              <strong>Vertical</strong>
              <output data-deck-art-y-output>Center</output>
            </span>

            <input
              type="range"
              min="-1"
              max="1"
              step="0.01"
              value="0"
              data-deck-art-y
            />
          </label>

          <button
            type="button"
            class="action-button secondary-button deck-art-reset-framing"
            data-deck-art-reset
          >
            Reset Framing
          </button>
        </div>
      </aside>

      <div class="deck-art-controls-column">
        <div
          class="flash-message deck-art-message hidden"
          data-deck-art-message
        ></div>

        <section class="deck-art-section-card">
          <div class="deck-art-section-label">Art Source</div>

          <div
            class="deck-art-source-toggle"
            role="group"
            aria-label="Art Source"
          >
            <button
              type="button"
              class="deck-art-source-button"
              data-deck-art-source="deck"
            >
              <i class="fa-solid fa-layer-group" aria-hidden="true"></i>
              Deck
            </button>

            <button
              type="button"
              class="deck-art-source-button"
              data-deck-art-source="upload"
            >
              <i class="fa-solid fa-upload" aria-hidden="true"></i>
              Upload
            </button>
          </div>

          <div class="deck-art-source-panel" data-deck-art-deck-panel>
            <label class="deck-art-field">
              <span>Card</span>
              <select data-deck-art-card-select></select>
            </label>

            <div class="deck-art-field-help">
              Includes cards from the main deck and sideboard.
            </div>
          </div>

          <div class="deck-art-source-panel hidden" data-deck-art-upload-panel>
            <label
              class="deck-art-upload-dropzone"
              data-deck-art-upload-dropzone
            >
              <input
                type="file"
                accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp"
                data-deck-art-upload-input
              />

              <i class="fa-solid fa-cloud-arrow-up" aria-hidden="true"></i>
              <strong>Choose or drop an image</strong>

              <span data-deck-art-upload-name>
                PNG, JPEG, or WebP up to 16 MB
              </span>
            </label>
          </div>
        </section>

        <section class="deck-art-section-card">
          <div class="deck-art-section-label">Frame</div>

          <div class="deck-art-frame-grid" data-deck-art-frame-grid></div>
        </section>

        <section class="deck-art-section-card deck-art-text-fields">
          <label class="deck-art-field">
            <span>Deck Title</span>

            <input
              type="text"
              maxlength="160"
              autocomplete="off"
              data-deck-art-title
            />
          </label>

          <label class="deck-art-field">
            <span>Deck Subtitle</span>

            <input
              type="text"
              maxlength="180"
              autocomplete="off"
              placeholder="Optional subtitle"
              data-deck-art-subtitle
            />
          </label>

          <label class="deck-art-field">
            <span>Deck Type</span>
            <select data-deck-art-type></select>
          </label>
        </section>

        <div class="deck-art-modal-actions">
          <button
            type="button"
            class="action-button secondary-button"
            data-deck-art-close
          >
            Cancel
          </button>

          <button type="button" class="action-button" data-deck-art-generate>
            <i class="fa-solid fa-wand-magic-sparkles" aria-hidden="true"></i>
            Generate Deck Art
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
