{# *** CUTTING TEMPLATES - Silhouette Template Dialog *** #}
<div
    id="silhouetteTemplateLibraryModal"
    class="silhouette-template-library-modal hidden"
    aria-hidden="true"
    data-options-url="{{ url_for('silhouette_template_options') }}"
    data-upload-url="{{ url_for('silhouette_template_upload') }}"
    data-registration-library-url="{{ url_for('cutter_profile_library') }}"
>
    <div
        class="silhouette-template-library-backdrop"
        data-silhouette-template-library-close
    ></div>

    <div
        class="silhouette-template-library-dialog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="silhouetteTemplateLibraryTitle"
    >
        <div class="silhouette-template-library-header">
            <div>
                <h2 id="silhouetteTemplateLibraryTitle">
                    Card Cutting Machine Templates
                </h2>

                <p>
                    Manage cutting templates and the registration marks saved for your paper layouts.
                </p>
            </div>

            <button
                type="button"
                class="silhouette-template-library-close"
                data-silhouette-template-library-close
                title="Close"
                aria-label="Close"
            >
                ×
            </button>
        </div>

        <div class="silhouette-template-library-body">
            <div class="silhouette-template-library-views" role="group" aria-label="Template files">
                <button type="button" data-template-view="cutting" aria-pressed="true">Cutting Templates</button>
                <button type="button" data-template-view="registration" aria-pressed="false">Registration Marks</button>
            </div>
            <div class="silhouette-template-library-toolbar">
                <label
                    class="silhouette-template-library-filter"
                    for="silhouetteTemplateLibraryFilter"
                >
                    <span>Paper / Print Template</span>

                    <select id="silhouetteTemplateLibraryFilter">
                        <option value="">All</option>
                    </select>
                </label>

                <label
                    class="silhouette-template-library-filter"
                    for="silhouetteTemplateLibraryBrandFilter"
                >
                    <span>Cutting Machine Brand</span>

                    <select id="silhouetteTemplateLibraryBrandFilter">
                        <option value="">All Brands</option>
                    </select>
                </label>

                <div
                    id="silhouetteTemplateLibraryFilterSummary"
                    class="silhouette-template-library-filter-summary"
                ></div>
            </div>

            <div
                id="silhouetteTemplateLibraryGrid"
                class="silhouette-template-library-grid"
            ></div>

            <div
                id="silhouetteTemplateLibraryEmpty"
                class="silhouette-template-library-empty hidden"
            >
                No card cutting machine templates are currently available.
            </div>

            <div class="silhouette-template-library-admin-row">
                <button
                    type="button"
                    class="action-button"
                    data-cutter-setup-open
                    data-cutter-paper-target="silhouetteTemplateLibraryFilter"
                >
                    <i class="fa-solid fa-pen-ruler" aria-hidden="true"></i>
                    Cutter Template Setup
                </button>
                <button
                    type="button"
                    id="silhouetteTemplateUploadToggle"
                    class="action-button secondary-button"
                    aria-haspopup="dialog"
                    aria-controls="silhouetteTemplateUploadModal"
                >
                    <i class="fa-solid fa-plus"></i>
                    Add Cutting Machine Template
                </button>
            </div>

        </div>

        <div class="silhouette-template-library-footer">
            <div
                id="silhouetteTemplateLibraryStatus"
                class="silhouette-template-library-status hidden"
                role="status"
            ></div>
            <button
                type="button"
                class="action-button secondary-button"
                data-silhouette-template-library-close
            >
                Close
            </button>
        </div>
    </div>
</div>
